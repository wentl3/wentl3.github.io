<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>散熱架構情報</title>
<!-- D-012: standalone page, no build, no external domains; layout = `07` v0.6 §0 (four cells, map layer control, D-014) -->
<style>
:root {
  --bg: #eef2f3; --surface: #ffffff; --line: #cfd8db; --fg: #14232a; --muted: #56676e;
  --accent: #0b7f8c; --accent-soft: #d3ecee;
  --r1: #a9d4d9; --r2: #5fb0ba; --r3: #1f8592; --r4: #0d5a64;
  --w0: #cfe7d6; --w1: #e4eab0; --w2: #f0d79a; --w3: #e39a6b; --w4: #c9533d;
  --reg: #c4581f; --vendor: #6b5bb5; --unk: #c9d2d5; --land: #dde5e7; --sea: #e7eef0;
  --warn-bg: #fff3df; --warn-fg: #7a4a00;
  --n0: #e6f0d8; --n1: #a8d1a0; --n2: #4f9f8c; --n3: #1d5f6e; --hub: #6b5bb5; --cons: #c4581f;
  --b00: #e8e8e8; --b10: #ace4e4; --b20: #5ac8c8; --b01: #dfb0d6; --b11: #a5add3; --b21: #5698b9; --b02: #be64ac; --b12: #8c62aa; --b22: #3b4994;
  --f-body: "Helvetica Neue", "PingFang TC", "Noto Sans TC", Arial, sans-serif;
  --f-mono: ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a1e; --surface: #15242a; --line: #2a3d44; --fg: #e3edef; --muted: #93a7ad;
  --accent: #4cc3cf; --accent-soft: #163a40;
  --r1: #1f4f57; --r2: #2a7883; --r3: #3ba5b1; --r4: #7fd6df;
  --w0: #2f5a3d; --w1: #56602c; --w2: #7a6630; --w3: #8f4a2a; --w4: #a5372a;
  --reg: #f08a4b; --vendor: #a99bf0; --unk: #2c3b40; --land: #1e2f35; --sea: #12201f;
  --warn-bg: #3a2c12; --warn-fg: #f3cf8a;
  --n0: #24402f; --n1: #2f6a55; --n2: #3f9a86; --n3: #8fd9c6; --hub: #a99bf0; --cons: #f08a4b; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 var(--f-body); }
.wrap { padding: 12px 16px 32px; max-width: 1440px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2, h3 { margin: 0; }
h1 { font-size: 1.35rem; }
h2 { font-size: .9rem; letter-spacing: .06em; color: var(--muted); }
h3 { font-size: .98rem; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .82rem; }
.muted { color: var(--muted); }
#topbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.ctl { display: flex; gap: 6px; align-items: center; }
.ctl-label { font-weight: 600; font-size: .75rem; letter-spacing: .06em; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button, .chip { font: 500 .85rem var(--f-body); border: 0; background: var(--surface); color: var(--fg); padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.chip { border: 1px solid var(--line); border-radius: 999px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { margin-left: 8px; padding: 1px 6px; border-radius: 3px; font-size: .75rem; }
.badge.stale, .badge.offline { background: var(--warn-bg); color: var(--warn-fg); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; }
@media (max-width: 960px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.mapbox { background: var(--sea); border: 1px solid var(--line); border-radius: 6px; position: relative; min-width: 0; }
#map { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
.sphere { fill: var(--sea); }
.country { stroke: var(--bg); stroke-width: .5; cursor: pointer; fill: var(--land); }
.country:hover { stroke: var(--fg); stroke-width: .9; }
.country.sel { stroke: var(--fg); stroke-width: 1.5; }
.country.hatch { fill: url(#hatch); }
.hatch-bg { fill: var(--unk); } .hatch-line { stroke: var(--surface); stroke-width: 2; }
.country.r1 { fill: var(--r1); } .country.r2 { fill: var(--r2); } .country.r3 { fill: var(--r3); } .country.r4 { fill: var(--r4); }
.country.w0 { fill: var(--w0); } .country.w1 { fill: var(--w1); } .country.w2 { fill: var(--w2); } .country.w3 { fill: var(--w3); } .country.w4 { fill: var(--w4); }
.dot { fill: var(--reg); stroke: var(--surface); stroke-width: 1; cursor: pointer; opacity: .9; }
.dot.hollow { fill: var(--surface); stroke: var(--reg); stroke-width: 2; }
.dot.sel { stroke: var(--fg); stroke-width: 2; }
.country.n0 { fill: var(--n0); } .country.n1 { fill: var(--n1); } .country.n2 { fill: var(--n2); } .country.n3 { fill: var(--n3); }
.country.b00, .bv.b00 { fill: var(--b00); background: var(--b00); } .country.b10, .bv.b10 { fill: var(--b10); background: var(--b10); } .country.b20, .bv.b20 { fill: var(--b20); background: var(--b20); }
.country.b01, .bv.b01 { fill: var(--b01); background: var(--b01); } .country.b11, .bv.b11 { fill: var(--b11); background: var(--b11); } .country.b21, .bv.b21 { fill: var(--b21); background: var(--b21); }
.country.b02, .bv.b02 { fill: var(--b02); background: var(--b02); } .country.b12, .bv.b12 { fill: var(--b12); background: var(--b12); } .country.b22, .bv.b22 { fill: var(--b22); background: var(--b22); }
.country.dim { opacity: .25; }
.hub { fill: var(--surface); fill-opacity: .9; stroke: var(--hub); stroke-width: 2.2; cursor: pointer; }
.hub.power { stroke: var(--cons); stroke-width: 2.8; }
.hub.sel { stroke: var(--fg); stroke-width: 3; }
.cons { fill: var(--cons); stroke: var(--surface); stroke-width: .8; cursor: pointer; }
.pin { stroke: var(--surface); stroke-width: .8; cursor: pointer; } .pin.site { fill: var(--accent); } .pin.hub { fill: var(--hub); }
.pin-key.site { color: var(--accent); } .pin-key.hub { color: var(--hub); }
.tag.stamp { color: var(--surface); background: var(--accent); border-color: var(--accent); }
.analysis { margin: 12px 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.scatter { display: block; width: 100%; max-width: 640px; height: auto; } .scatter .axis { stroke: var(--line); } .scatter .tick { fill: var(--muted, var(--fg)); font-size: 9px; }
.scatter .pt { stroke: var(--surface); stroke-width: .8; cursor: pointer; fill-opacity: .85; }
.scatter .reg0 { fill: var(--n1); } .scatter .reg1 { fill: var(--n2); } .scatter .reg2 { fill: var(--reg); }
.tag.sig.rumour { border-style: dashed; } .tag.sig.confirmed { font-weight: 600; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; } .fact-num b { font-family: var(--f-mono); }
.conflict { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; background: var(--warn-bg); color: var(--warn-fg); padding: 4px 6px; border-radius: 4px; }
#map-ctl { padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface); border-radius: 6px 6px 0 0; display: grid; gap: 6px; }
.map-ctl-row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: .85rem; }
.map-ctl-row .ctl { gap: 4px; }
input.num { width: 6.5em; font: inherit; padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); }
.legend-bivar { display: flex; gap: 8px; align-items: center; }
.bivar-grid { display: grid; grid-template-columns: repeat(3, 12px); gap: 1px; }
.bv { width: 12px; height: 12px; display: block; }
.small { font-size: .75rem; }
.state.inline { display: inline; margin: 0; }
.zoom { position: absolute; right: 10px; top: 92px; display: grid; gap: 4px; }
.zoom button { width: 30px; height: 30px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 4px; cursor: pointer; }
#map-state { position: absolute; left: 10px; top: 92px; font-size: .8rem; color: var(--warn-fg); }
.legend { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: .75rem; color: var(--muted); display: grid; gap: 2px; }
aside#conditions, .cell, footer { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
aside#conditions { display: grid; gap: 10px; align-content: start; max-height: 720px; overflow: auto; }
.cells { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 960px) { .cells { grid-template-columns: minmax(0, 1fr); } }
.cell { display: grid; gap: 6px; align-content: start; max-height: 560px; overflow: auto; }
.cell > h2 { position: sticky; top: -14px; background: var(--surface); padding-block: 4px; }
.chip.more { justify-self: start; margin-top: 6px; }
button.tag.pick { background: none; cursor: pointer; font-family: var(--f-body); }
button.tag.pick:hover { background: var(--accent-soft); }
.tag.vend { color: var(--vendor); }
.fit { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.fit li span { display: block; }
.kv { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 6px 10px; margin: 0; }
.kv dt { font-weight: 600; font-size: .8rem; color: var(--muted); }
.kv dd { margin: 0; display: grid; gap: 4px; }
.kv dd .tag, .kv dd .chip { justify-self: start; }
.fact .src { display: block; font-size: .78rem; }
.na { color: var(--muted); font-style: italic; }
.tag { font-size: .7rem; font-weight: 600; padding: 0 6px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
.tag.ok { color: var(--accent); } .tag.warn { color: var(--reg); } .tag.scen { color: var(--vendor); } .tag.muted, .tag.geo, .tag.tech { color: var(--muted); }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 6px; }
.list { display: grid; }
.item { border-top: 1px solid var(--line); padding-block: 9px; display: grid; gap: 4px; }
.item:first-child { border-top: 0; }
.item h3 { font-size: .95rem; font-weight: 600; }
.item p { margin: 0; }
.item .meta, .case-facts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: .8rem; }
.quotes { margin: 4px 0 0; padding-left: 1.2em; font-size: .85rem; }
.note { font-size: .82rem; color: var(--muted); margin: 0 0 6px; }
.state { color: var(--muted); font-style: italic; margin: 6px 0; display: flex; gap: 8px; align-items: center; }
.state.offline, .state.error { color: var(--warn-fg); background: var(--warn-bg); padding: 6px 10px; border-radius: 4px; font-style: normal; }
footer { font-size: .85rem; }
.licenses { margin: 6px 0 0; padding-left: 1.2em; }
select, input[type=search] { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); max-width: 100%; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div class="wrap">
  <a href="news.html">散熱新聞面板 →</a>
  <a href="tech.html">硬體與散熱動態 →</a>
  <header id="topbar" data-panel="topbar"></header>
  <div class="stage">
    <div class="mapbox" data-panel="map">
      <div id="map-ctl" aria-label="地圖圖層"></div>
      <svg id="map" role="img" aria-label="世界地圖：點國家看條件"></svg>
      <div id="map-state" aria-live="polite"></div>
      <div class="zoom"><button type="button" id="zoom-in" aria-label="放大">＋</button><button type="button" id="zoom-out" aria-label="縮小">－</button><button type="button" id="zoom-reset" aria-label="重設">⟲</button></div>
      <div class="legend" id="legend"></div>
    </div>
    <aside id="conditions" data-panel="conditions" aria-live="polite"></aside>
  </div>
  <section class="cells" aria-label="四格">
    <div class="cell"><h2>新聞</h2><div id="cell-news" data-panel="news"></div></div>
    <div class="cell"><h2>業者</h2><div id="cell-vendors" data-panel="vendors"></div></div>
    <div class="cell"><h2>參考庫</h2><div id="cell-library" data-panel="library"></div></div>
    <div class="cell"><h2>案例</h2><div id="cell-cases" data-panel="cases"></div></div>
  </section>
  <section class="analysis" aria-label="關聯分析"><h2>關聯分析</h2><div id="panel-analysis" data-panel="analysis"></div></section>
  <footer id="footer" data-panel="footer"></footer>
</div>
</body>
</html>
